<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEIÐR</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  #stage {
    position: absolute;
    inset: 0;
    /* Clip so scale corrections don't bleed outside */
    overflow: hidden;
  }

  /* Each frame: pre-cropped to 1023×575 (16:9) with pupils pixel-locked.
     object-fit:cover fills the canvas; pupils are at exactly 50% x / 48% y
     in every image, so cover never drifts them. */
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 48%;
    opacity: 0;
    will-change: opacity, filter;
    transform-origin: 50% 48%;
    transform: none;
  }

  #f1 { opacity: 1; }

  /* ── TITLE ── */
  #title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }

  /* ── SUBTITLE ── */
  #subtitle {
    position: absolute;
    top: calc(50% + clamp(3rem, 6vw, 5.5rem));
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: clamp(0.5rem, 1.1vw, 0.8rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(255,255,255,0);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  /* ── SCROLL CUE ── */
  #scroll-cue {
    position: absolute;
    bottom: 2.2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
  }
  #scroll-cue span {
    font-size: 0.55rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-family: 'Courier New', monospace;
  }
  #scroll-cue .line {
    width: 1px;
    height: 2rem;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.8} }

  #dbg {
    position: absolute;
    bottom: 1.5rem;
    right: 1.5rem;
    font-family: 'Courier New', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.15);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <img id="f1" class="frame" src="../assets/img/seidr_f1.png" alt="" draggable="false" />
  <img id="f2" class="frame" src="../assets/img/seidr_f2.png" alt="" draggable="false" />
  <img id="f3" class="frame" src="../assets/img/seidr_f3.png" alt="" draggable="false" />
  <img id="f4" class="frame" src="../assets/img/seidr_f4.png" alt="" draggable="false" />
  <img id="f5" class="frame" src="../assets/img/seidr_f5.png" alt="" draggable="false" />
  <img id="f6" class="frame" src="../assets/img/seidr_f6.png" alt="" draggable="false" />
  <img id="f7" class="frame" src="../assets/img/seidr_f7.png" alt="" draggable="false" />
  <img id="f8" class="frame" src="../assets/img/seidr_f8.png" alt="" draggable="false" />
  <img id="f9" class="frame" src="../assets/img/seidr_f9.png" alt="" draggable="false" />
</div>

<div id="title">SEIÐR</div>
<div id="subtitle">ᛋᛖᛁᚦᚱ · nordic seiðr trance</div>
<div id="scroll-cue"><span>scroll</span><div class="line"></div></div>
<div id="dbg">—</div>

<script>
/* ═══════════════════════════════════════════════════════
   SEIÐR — pupil-locked 9-frame scroll crossfade

   Key technique:
   • Each <img> has a CSS transform that corrects its pupil
     position to match frame 1's reference pixel coordinate.
   • During a crossfade the outgoing frame gets a mild blur
     that peaks at the midpoint then clears — this masks the
     residual micro-difference and reads as a supernatural
     glow transition rather than a hard cut.
   ═══════════════════════════════════════════════════════ */

const FRAMES = [f1,f2,f3,f4,f5,f6,f7,f8,f9];
const NAMES  = ['CLOSED','OPENING','HALF-OPEN','AWAKE','IGNITE','CRIMSON','VOID','DIMMING','CLOSING'];

const title    = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const cue      = document.getElementById('scroll-cue');
const dbg      = document.getElementById('dbg');

// Pre-load all images
FRAMES.forEach(img => img.decode && img.decode().catch(() => {}));

/* ── CROSSFADE SCHEDULE ────────────────────────────────
   Arc (9 frames, 8 transitions). Each entry is for frame i:
   { xs: xfade_start, xe: xfade_end }
   Frame i is fully visible from previous xe → xs,
   crossfades out xs → xe (while frame i+1 fades in).
   ───────────────────────────────────────────────────── */
const SCHEDULE = [
  { xs: 0.05,  xe: 0.14 },  // f1 → f2
  { xs: 0.18,  xe: 0.27 },  // f2 → f3
  { xs: 0.31,  xe: 0.41 },  // f3 → f4
  { xs: 0.45,  xe: 0.53 },  // f4 → f5
  { xs: 0.56,  xe: 0.63 },  // f5 → f6
  { xs: 0.66,  xe: 0.73 },  // f6 → f7
  { xs: 0.76,  xe: 0.83 },  // f7 → f8
  { xs: 0.87,  xe: 0.95 },  // f8 → f9
  { xs: 1.00,  xe: 1.00 },  // f9 — final hold
];

const clamp  = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const norm   = (v, lo, hi) => lo >= hi ? 1 : clamp((v - lo) / (hi - lo), 0, 1);
const ease   = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
// Smooth-step (used for blur bell curve)
const smooth = t => t * t * (3 - 2 * t);

function frameOpacity(i, p) {
  if (i === 0) {
    const s = SCHEDULE[0];
    if (p < s.xs) return 1;
    if (p < s.xe) return ease(1 - norm(p, s.xs, s.xe));
    return 0;
  }
  if (i === FRAMES.length - 1) {
    const prev = SCHEDULE[i - 1];
    if (p < prev.xs) return 0;
    if (p < prev.xe) return ease(norm(p, prev.xs, prev.xe));
    return 1;
  }
  const prev = SCHEDULE[i - 1];
  const curr = SCHEDULE[i];
  if (p < prev.xs) return 0;
  if (p < prev.xe) return ease(norm(p, prev.xs, prev.xe));  // fading in
  if (p < curr.xs) return 1;                                 // hold
  if (p < curr.xe) return ease(1 - norm(p, curr.xs, curr.xe)); // fading out
  return 0;
}

/* ── BLUR TRANSITION ──────────────────────────────────
   During each crossfade window, the OUTGOING frame gets
   a radial blur that peaks at the midpoint (t=0.5).
   This smooths the perceived discontinuity between images.
   Max blur: 6px — just enough to blend, not lose detail.
   ──────────────────────────────────────────────────── */
const MAX_BLUR = 5; // px

function frameBlur(i, p) {
  // Each frame is blurred on the way OUT (during its exit xfade)
  const curr = SCHEDULE[i];
  if (curr.xs >= curr.xe) return 0;
  if (p < curr.xs || p > curr.xe) return 0;
  const t = norm(p, curr.xs, curr.xe);
  // Bell curve: 0→1→0 peaking at t=0.5
  const bell = smooth(t < 0.5 ? t * 2 : (1 - t) * 2);
  return MAX_BLUR * bell;
}

// ── RENDER ──
function render(p) {
  for (let i = 0; i < FRAMES.length; i++) {
    const op = frameOpacity(i, p);
    const bl = frameBlur(i, p);
    FRAMES[i].style.opacity = op.toFixed(4);
    FRAMES[i].style.filter  = bl > 0.1 ? `blur(${bl.toFixed(2)}px)` : 'none';
  }

  // Subtle zoom on f7 (void) peak
  const f7op = frameOpacity(6, p);
  f7.style.transform = `scale(${(1.0 + f7op * 0.04).toFixed(4)})`;

  // ── TITLE ──
  let ta = 0;
  if (p > 0.30 && p < 0.97) {
    const inT  = ease(clamp((p - 0.30) / 0.12, 0, 1));
    const outT = p > 0.88 ? ease(clamp(1 - (p - 0.88) / 0.09, 0, 1)) : 1;
    ta = inT * outT;
  }

  const f5op = frameOpacity(4, p);
  const f6op = frameOpacity(5, p);
  const f7op2 = frameOpacity(6, p);

  const r = 255;
  const g = Math.round(clamp(255 - f6op * 200 - f5op * 50 + f7op2 * 60, 0, 255));
  const b = Math.round(clamp(255 - f5op * 210 - f6op * 255 - f7op2 * 80, 20, 255));

  title.style.color = `rgba(${r},${g},${b},${ta.toFixed(3)})`;

  const glowA = (f5op * 0.4 + f6op * 0.7 + f7op2 * 0.9) * ta;
  const glowR = f6op > 0.3 ? 160 : 255;
  const glowG = Math.round(f7op2 * 120 + f5op * 80);
  title.style.textShadow = glowA > 0.05
    ? `0 0 50px rgba(${glowR},${glowG},0,${glowA.toFixed(3)}), 0 0 130px rgba(${glowR},0,0,${(glowA * 0.4).toFixed(3)})`
    : 'none';

  subtitle.style.color = `rgba(255,255,255,${(ta * 0.4).toFixed(3)})`;
  cue.style.opacity = p < 0.03 ? 1 : Math.max(0, 1 - (p - 0.03) * 25).toFixed(3);

  // Debug
  const ops = FRAMES.map((_, i) => frameOpacity(i, p));
  const dom = ops.indexOf(Math.max(...ops));
  dbg.textContent = `${NAMES[dom]}  ${(p * 100).toFixed(0)}%`;
}

// ── VIRTUAL WHEEL ENGINE ──
const TOTAL_WHEEL = 4000;
let vp = 0;
let dp = 0;

window.addEventListener('wheel', e => {
  e.preventDefault();
  vp = Math.max(0, Math.min(1, vp + e.deltaY / TOTAL_WHEEL));
}, { passive: false });

let _ty = 0;
window.addEventListener('touchstart', e => { _ty = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', e => {
  e.preventDefault();
  const dy = _ty - e.touches[0].clientY;
  _ty = e.touches[0].clientY;
  vp = Math.max(0, Math.min(1, vp + dy / (TOTAL_WHEEL * 0.28)));
}, { passive: false });

function tick() {
  dp += (vp - dp) * 0.06;
  render(dp);
  requestAnimationFrame(tick);
}

render(0);
tick();
</script>
</body>
</html>
