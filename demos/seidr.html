<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEIÐR</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* ── STAGE ── */
  #stage {
    position: absolute;
    inset: 0;
  }

  /* Each frame is absolute, full-bleed, opacity-controlled */
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    opacity: 0;
    will-change: opacity;
    /* Slight zoom on mid-journey frames for pull-in effect */
    transform: scale(1.04);
    transition: none; /* JS controls this */
  }

  /* F1 starts visible */
  #f1 { opacity: 1; transform: scale(1); }

  /* ── TITLE OVERLAY ── */
  #title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    text-shadow: none;
  }

  /* ── SUBTITLE ── */
  #subtitle {
    position: absolute;
    top: calc(50% + clamp(3rem, 6vw, 5.5rem));
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: clamp(0.5rem, 1.1vw, 0.8rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  /* ── SCROLL CUE ── */
  #scroll-cue {
    position: absolute;
    bottom: 2.2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.6s ease;
  }
  #scroll-cue span {
    font-size: 0.55rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-family: 'Courier New', monospace;
  }
  #scroll-cue .line {
    width: 1px;
    height: 2rem;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  /* ── DEBUG ── */
  #dbg {
    position: absolute;
    bottom: 1.5rem;
    right: 1.5rem;
    font-family: 'Courier New', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.18);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <!-- Image sequence — 5 frames, crossfaded by scroll -->
  <img id="f1" class="frame" src="../assets/img/seidr_f1.png" alt="" draggable="false" />
  <img id="f2" class="frame" src="../assets/img/seidr_f2.png" alt="" draggable="false" />
  <img id="f3" class="frame" src="../assets/img/seidr_f3.png" alt="" draggable="false" />
  <img id="f4" class="frame" src="../assets/img/seidr_f4.png" alt="" draggable="false" />
  <img id="f5" class="frame" src="../assets/img/seidr_f5.png" alt="" draggable="false" />
</div>

<div id="title">SEIÐR</div>
<div id="subtitle">ᛋᛖᛁᚦᚱ · nordic seiðr trance</div>
<div id="scroll-cue"><span>scroll</span><div class="line"></div></div>
<div id="dbg">—</div>

<script>
/* ════════════════════════════════════════════════════
   SEIÐR — Scroll-driven image crossfade
   Exactly like the ОЧИ site: real photograph frames
   crossfade based on virtual scroll progress.
   No canvas drawing over the image.
   ════════════════════════════════════════════════════ */

const frames   = [f1, f2, f3, f4, f5];
const title    = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const cue      = document.getElementById('scroll-cue');
const dbg      = document.getElementById('dbg');

// Pre-load all images
frames.forEach(img => { img.decode && img.decode().catch(() => {}); });

// ── VIRTUAL SCROLL ──
// Segment map: each frame transition occupies a portion of 0→1 progress
// 5 images → 4 transitions, plus hold regions
// p=0   : f1 fully visible (natural eyes)
// p=0.15: begin crossfade f1→f2 (dilating)
// p=0.30: f2 fully visible; begin crossfade f2→f3
// p=0.45: f3 fully visible (possessed)
// p=0.58: begin crossfade f3→f4
// p=0.68: f4 fully visible (void)
// p=0.78: begin crossfade f4→f5
// p=0.90: f5 fully visible (return)
// p=1.00: end

const SEGMENTS = [
  { from: 0,    to: 0.18 },   // f1 hold
  { from: 0.18, to: 0.36 },   // f1→f2 transition
  { from: 0.36, to: 0.50 },   // f2 hold → into f3
  { from: 0.50, to: 0.63 },   // f2→f3 transition
  { from: 0.63, to: 0.73 },   // f3 hold → into f4
  { from: 0.73, to: 0.82 },   // f3→f4 transition
  { from: 0.82, to: 0.90 },   // f4→f5 transition
  { from: 0.90, to: 1.00 },   // f5 hold
];

// Given global progress p (0→1), compute opacity for each frame
function computeOpacities(p) {
  const ops = [0, 0, 0, 0, 0];

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const norm  = (v, lo, hi) => clamp((v - lo) / (hi - lo), 0, 1);

  // f1: full from 0 → 0.18, fades out 0.18 → 0.36
  ops[0] = p < 0.18  ? 1
         : p < 0.36  ? 1 - norm(p, 0.18, 0.36)
         : 0;

  // f2: fades in 0.18→0.36, full 0.36→0.50, fades out 0.50→0.63
  ops[1] = p < 0.18  ? 0
         : p < 0.36  ? norm(p, 0.18, 0.36)
         : p < 0.50  ? 1
         : p < 0.63  ? 1 - norm(p, 0.50, 0.63)
         : 0;

  // f3: fades in 0.50→0.63, full 0.63→0.73, fades out 0.73→0.82
  ops[2] = p < 0.50  ? 0
         : p < 0.63  ? norm(p, 0.50, 0.63)
         : p < 0.73  ? 1
         : p < 0.82  ? 1 - norm(p, 0.73, 0.82)
         : 0;

  // f4: fades in 0.73→0.82, full 0.82→0.88, fades out 0.88→0.93
  ops[3] = p < 0.73  ? 0
         : p < 0.82  ? norm(p, 0.73, 0.82)
         : p < 0.88  ? 1
         : p < 0.93  ? 1 - norm(p, 0.88, 0.93)
         : 0;

  // f5: fades in 0.88→0.93, holds to 1.0
  ops[4] = p < 0.88  ? 0
         : p < 0.93  ? norm(p, 0.88, 0.93)
         : 1;

  return ops;
}

// Easing
const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

// ── RENDER ──
function render(dp) {
  const p = dp;
  const ops = computeOpacities(p);
  frames.forEach((img, i) => {
    img.style.opacity = ops[i].toFixed(4);
  });

  // Subtle zoom: f3 (possessed) scales up slightly as it peaks
  f3.style.transform = `scale(${1 + ops[2] * 0.06})`;

  // Title: appears at f2, peaks at f3, fades at f4
  let ta = 0, ts = 0;
  if (p > 0.25 && p < 0.90) {
    const inT   = Math.min(1, (p - 0.25) / 0.15);
    const outT  = p > 0.78 ? Math.max(0, 1 - (p - 0.78) / 0.12) : 1;
    ta = ease(inT) * outT;
  }
  const tr = 120 + ops[2] * 120; // amber → red during possession
  title.style.color     = `rgba(255,${Math.round(255-ops[2]*180)},${Math.round(255-ops[2]*240)},${ta.toFixed(3)})`;
  title.style.textShadow = ta > 0.05
    ? `0 0 60px rgba(255,${Math.round(200-ops[2]*180)},0,${(ta*0.6).toFixed(3)}), 0 0 120px rgba(180,0,0,${(ops[2]*ta*0.4).toFixed(3)})`
    : 'none';

  // Subtitle fades in with title
  subtitle.style.color = `rgba(255,255,255,${(ta * 0.45).toFixed(3)})`;

  // Scroll cue fades out once scrolling starts
  cue.style.opacity = p < 0.04 ? 1 : Math.max(0, 1 - p * 18);

  // Debug
  const names = ['NATURAL','DILATE','POSSESSED','VOID','RETURN'];
  const dominant = ops.indexOf(Math.max(...ops));
  dbg.textContent = `${names[dominant]}  ${(p*100).toFixed(0)}%`;
}

// ── VIRTUAL WHEEL ENGINE ──
const TOTAL_WHEEL = 3000;
let vp = 0;  // target progress
let dp = 0;  // display progress (smoothed)

window.addEventListener('wheel', e => {
  e.preventDefault();
  vp = Math.max(0, Math.min(1, vp + e.deltaY / TOTAL_WHEEL));
}, { passive: false });

window.addEventListener('touchstart', e => {
  _ty = e.touches[0].clientY;
}, { passive: true });

let _ty = 0;
window.addEventListener('touchmove', e => {
  e.preventDefault();
  vp = Math.max(0, Math.min(1, vp + (_ty - e.touches[0].clientY) / (TOTAL_WHEEL * 0.3)));
  _ty = e.touches[0].clientY;
}, { passive: false });

// ── TICK ──
function tick() {
  dp += (vp - dp) * 0.07;
  render(dp);
  requestAnimationFrame(tick);
}

render(0);
tick();
</script>
</body>
</html>
