<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEIÐR</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
  }

  /* Full-bleed face, fills the whole iframe */
  #face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  /* Canvas sits on top */
  #eye-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* Vignette darkens edges */
  #vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 25%,
      rgba(8,8,8,0.45) 65%,
      rgba(8,8,8,0.82) 100%);
    pointer-events: none;
  }

  /* SEIÐR title */
  #title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(3.5rem, 9vw, 7.5rem);
    font-family: 'Georgia', 'Times New Roman', serif;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: rgba(245,200,66,0);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  /* Scroll cue */
  #scroll-cue {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
  }
  #scroll-cue span {
    font-size: 0.58rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: rgba(232,160,32,0.55);
    font-family: 'Courier New', monospace;
  }
  #scroll-cue .arrow {
    width: 1px;
    height: 2.2rem;
    background: linear-gradient(to bottom, rgba(232,160,32,0.55), transparent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  /* Phase debug label */
  #phase-label {
    position: absolute;
    bottom: 1.8rem;
    right: 1.5rem;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    font-family: 'Courier New', monospace;
    pointer-events: none;
  }
</style>
</head>
<body>

<img id="face" src="../assets/img/shaman_face.png" alt="Viking Seiðr Shaman" />
<div id="vignette"></div>
<canvas id="eye-canvas"></canvas>
<div id="title">SEIÐR</div>
<div id="scroll-cue"><span>scroll</span><div class="arrow"></div></div>
<div id="phase-label">NORMAL  0%</div>

<script>
/* ══════════════════════════════════════════════════════
   SEIÐR — Virtual-scroll eye possession engine
   No DOM scroll. Pure wheel/touch → virtualProgress.
   ══════════════════════════════════════════════════════ */

const canvas = document.getElementById('eye-canvas');
const ctx    = canvas.getContext('2d');
const title  = document.getElementById('title');
const cue    = document.getElementById('scroll-cue');
const label  = document.getElementById('phase-label');

// ── CALIBRATED EYE POSITIONS ──
// Measured from 1024×1536 portrait at object-position center 40% in 1400×900 viewport
const EYES = [
  { xf: 0.308, yf: 0.484 },
  { xf: 0.684, yf: 0.484 },
];
const IRIS_R_FRAC = 0.067;   // iris radius as fraction of viewport width

// ── COLOURS ──
const C = {
  amber: [232,160, 32],
  gold:  [245,200, 66],
  cyan:  [  0,229,255],
  pink:  [255, 45,120],
  white: [255,255,255],
  black: [  4,  2,  0],
};
const rgba = (col, a) => `rgba(${col[0]},${col[1]},${col[2]},${a.toFixed(3)})`;

// ── PHASES [start, end] fraction of 0–1 ──
const PHASES = [
  { name:'NORMAL',   s:0.00, e:0.10 },
  { name:'DILATE',   s:0.10, e:0.24 },
  { name:'SPIRAL',   s:0.24, e:0.40 },
  { name:'ALGIZ ᛉ',  s:0.40, e:0.56 },
  { name:'VOID',     s:0.56, e:0.68 },
  { name:'OTHALA ᛟ', s:0.68, e:0.82 },
  { name:'RETURN',   s:0.82, e:1.00 },
];

// ── HELPERS ──
const lerp  = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const ease  = t => t<.5 ? 2*t*t : -1+(4-2*t)*t;

function phaseOf(p) {
  for (let i=0; i<PHASES.length; i++) {
    const ph = PHASES[i];
    if (p >= ph.s && p < ph.e + 0.001) {
      return { idx:i, t: clamp((p-ph.s)/(ph.e-ph.s), 0, 1) };
    }
  }
  return { idx:PHASES.length-1, t:1 };
}

// ── RESIZE ──
function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resize(); });
resize();

// ── DRAW ONE EYE ──
let angle = 0;

function drawEye(cx, cy, R, idx, t) {
  const pupR = R * 0.28;

  function runeAlgiz(a) {
    ctx.save(); ctx.translate(cx,cy);
    const h = R*0.72;
    ctx.strokeStyle = rgba(C.cyan, a);
    ctx.lineWidth = R*0.10; ctx.lineCap='round';
    ctx.shadowColor = rgba(C.cyan, a*0.9); ctx.shadowBlur = R*0.7;
    ctx.beginPath();
    ctx.moveTo(0,h); ctx.lineTo(0,-h);
    ctx.moveTo(0,-h*0.05); ctx.lineTo(-h*0.58,-h*0.72);
    ctx.moveTo(0,-h*0.05); ctx.lineTo( h*0.58,-h*0.72);
    ctx.stroke(); ctx.restore();
  }

  function runeOthala(a) {
    ctx.save(); ctx.translate(cx,cy);
    const hw=R*0.50, hh=R*0.55, leg=R*0.22;
    ctx.strokeStyle = rgba(C.pink, a);
    ctx.lineWidth = R*0.10; ctx.lineCap='round';
    ctx.shadowColor = rgba(C.pink, a*0.9); ctx.shadowBlur = R*0.7;
    ctx.beginPath();
    ctx.moveTo(0,-hh); ctx.lineTo(hw,0); ctx.lineTo(0,hh); ctx.lineTo(-hw,0); ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-hw*0.55, hh*0.42); ctx.lineTo(-hw*0.55, hh*0.42+leg);
    ctx.moveTo( hw*0.55, hh*0.42); ctx.lineTo( hw*0.55, hh*0.42+leg);
    ctx.stroke(); ctx.restore();
  }

  if (idx === 0) return; // NORMAL — no overlay

  if (idx === 1) { // DILATE
    const big = ease(t);
    const bigP = lerp(pupR, R*0.70, big);
    const g = ctx.createRadialGradient(cx,cy,bigP*0.9, cx,cy,R);
    g.addColorStop(0, rgba(C.amber,0));
    g.addColorStop(0.4, rgba(C.gold, big*0.5));
    g.addColorStop(1, rgba(C.amber, big*0.25));
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,bigP,0,Math.PI*2);
    ctx.fillStyle=rgba(C.black, lerp(0.2,0.9,big)); ctx.fill();
    return;
  }

  if (idx === 2) { // SPIRAL
    const sp = ease(t);
    ctx.beginPath(); ctx.arc(cx,cy,R*0.68,0,Math.PI*2);
    ctx.fillStyle=rgba(C.black,0.72); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
    for (let arm=0; arm<2; arm++) {
      ctx.beginPath();
      const turns=3.5+sp*2, spin=angle*(1+sp*3), off=arm*Math.PI;
      for (let i=0; i<=240; i++) {
        const f=i/240, r=f*R*0.66, a=f*Math.PI*2*turns+spin+off;
        const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle=rgba(arm===0?C.gold:C.amber, sp*0.85);
      ctx.lineWidth=R*0.065; ctx.lineCap='round';
      ctx.shadowColor=rgba(C.gold,sp*0.5); ctx.shadowBlur=14;
      ctx.stroke();
    }
    const rim=ctx.createRadialGradient(cx,cy,R*0.55, cx,cy,R);
    rim.addColorStop(0,rgba(C.gold,0)); rim.addColorStop(1,rgba(C.gold,sp*0.55));
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=rim; ctx.fill();
    ctx.restore(); return;
  }

  if (idx === 3) { // ALGIZ
    const ap = ease(t);
    const g=ctx.createRadialGradient(cx,cy,0, cx,cy,R);
    g.addColorStop(0,rgba(C.gold,ap*0.95));
    g.addColorStop(0.5,rgba(C.white,ap*0.88));
    g.addColorStop(1,rgba(C.cyan,ap*0.35));
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    runeAlgiz(ap*(0.65+0.35*Math.sin(angle*3.2))); return;
  }

  if (idx === 4) { // VOID
    const vp = ease(t);
    ctx.beginPath(); ctx.arc(cx,cy,R*1.06,0,Math.PI*2);
    ctx.fillStyle=rgba(C.white,vp); ctx.fill();
    const halo=ctx.createRadialGradient(cx,cy,R*0.8, cx,cy,R*1.4);
    halo.addColorStop(0,rgba(C.white,0)); halo.addColorStop(1,rgba(C.gold,vp*0.3));
    ctx.beginPath(); ctx.arc(cx,cy,R*1.4,0,Math.PI*2); ctx.fillStyle=halo; ctx.fill();
    return;
  }

  if (idx === 5) { // OTHALA
    const op = ease(t);
    const g=ctx.createRadialGradient(cx,cy,0, cx,cy,R);
    g.addColorStop(0,rgba(C.pink,op*0.45));
    g.addColorStop(0.4,rgba(C.amber,op*0.92));
    g.addColorStop(1,rgba(C.gold,op*0.65));
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,pupR,0,Math.PI*2);
    ctx.fillStyle=rgba(C.black,op*0.9); ctx.fill();
    runeOthala(op*(0.6+0.4*Math.sin(angle*2.8))); return;
  }

  if (idx === 6) { // RETURN
    const fade = 1-ease(t);
    if (fade < 0.02) return;
    const g=ctx.createRadialGradient(cx,cy,0, cx,cy,R);
    g.addColorStop(0,rgba(C.black,0));
    g.addColorStop(0.35,rgba(C.amber,fade*0.30));
    g.addColorStop(1,rgba(C.gold,fade*0.20));
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
    ctx.beginPath();
    for (let i=0; i<=160; i++) {
      const f=i/160, r=f*R*0.6, a=f*Math.PI*2*3-angle*1.2;
      const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.strokeStyle=rgba(C.gold,fade*0.35); ctx.lineWidth=R*0.05;
    ctx.shadowColor=rgba(C.gold,fade*0.2); ctx.shadowBlur=8;
    ctx.stroke(); ctx.restore(); return;
  }
}

// ── RENDER ──
function render(p) {
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const R=W*IRIS_R_FRAC;
  const {idx,t}=phaseOf(p);
  for (const eye of EYES) drawEye(eye.xf*W, eye.yf*H, R, idx, t);

  // title
  let ta=0;
  if(idx===2) ta=ease(t)*0.72;
  else if(idx===3) ta=0.88;
  else if(idx===4) ta=lerp(0.88,0,ease(t));
  else if(idx===5) ta=ease(t)*0.65;
  else if(idx===6) ta=lerp(0.65,0,ease(t));
  title.style.color=`rgba(245,200,66,${ta})`;
  title.style.textShadow=ta>0.01
    ?`0 0 40px rgba(245,200,66,${ta*0.55}),0 0 80px rgba(245,200,66,${ta*0.25})`
    :'none';

  // scroll cue
  cue.style.opacity = p<0.06 ? 1 : Math.max(0,1-p*14);

  // debug label
  label.textContent=`${PHASES[idx].name}  ${(p*100).toFixed(0)}%`;
}

// ══════════════════════════════════════════════════
// VIRTUAL SCROLL ENGINE
// wheel + touch → virtualProgress (0–1), no DOM scroll
// Works inside iframes and standalone
// ══════════════════════════════════════════════════

const TOTAL_WHEEL = 3200;   // total deltaY units for full journey
let vp = 0;   // virtual progress target
let dp = 0;   // display progress (smoothed)
let ty = 0;   // touch start Y

window.addEventListener('wheel', e => {
  e.preventDefault();
  vp = clamp(vp + e.deltaY / TOTAL_WHEEL, 0, 1);
}, { passive: false });

window.addEventListener('touchstart', e => {
  ty = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', e => {
  e.preventDefault();
  vp = clamp(vp + (ty - e.touches[0].clientY) / (TOTAL_WHEEL * 0.3), 0, 1);
  ty = e.touches[0].clientY;
}, { passive: false });

// ── TICK: lerp + render every frame ──
function tick() {
  angle += 0.02;
  dp += (vp - dp) * 0.09;
  render(dp);
  requestAnimationFrame(tick);
}

render(0);
tick();
</script>
</body>
</html>
