<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Flesh Grid</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0305;display:flex;align-items:center;justify-content:center}
#canvas{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:.55rem;letter-spacing:.4em;color:rgba(255,100,80,.25);text-transform:uppercase;pointer-events:none;white-space:nowrap}
#banner{position:absolute;top:1.2rem;right:1.4rem;text-align:right;pointer-events:none;font-family:'Courier New',monospace}
#banner .bnum{display:block;font-size:.5rem;letter-spacing:.35em;color:rgba(255,45,120,.5);text-transform:uppercase}
#banner .bname{display:block;font-size:.75rem;letter-spacing:.2em;color:rgba(255,255,255,.55);text-transform:uppercase;font-weight:700}
#banner .btech{display:block;font-size:.45rem;letter-spacing:.25em;color:rgba(255,255,255,.2);text-transform:uppercase;margin-top:.15rem}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="banner">
  <span class="bnum">07</span>
  <span class="bname">Flesh Grid</span>
  <span class="btech">organic canvas cells</span>
</div>
<div id="hint">hover to wound · click to heal · scroll to mutate</div>
<script>
const C = document.getElementById('canvas');
const ctx = C.getContext('2d');
let W, H, COLS, ROWS, CELL;

const mouse = {x:-9999,y:-9999,down:false};
let mutationLevel = 0; // 0..1
let t = 0;

// ── CELL STATE ───────────────────────────────────────────
let cells = [];

function resize() {
  W = C.width  = C.offsetWidth;
  H = C.height = C.offsetHeight;
  CELL = Math.round(Math.min(W,H) / 18);
  COLS = Math.ceil(W / CELL) + 1;
  ROWS = Math.ceil(H / CELL) + 1;
  initCells();
}

function initCells() {
  cells = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      cells.push({
        r, c,
        // Base pulse offset — each cell breathes on its own rhythm
        phase:  Math.random() * Math.PI * 2,
        phase2: Math.random() * Math.PI * 2,
        // wound level 0=healthy 1=deep wound
        wound: 0,
        // mutation state
        mutant: Math.random() < 0.04,
        // local noise seed
        seed: Math.random(),
        // pulsation speed
        rate: 0.6 + Math.random() * 0.8,
      });
    }
  }
}

// Perlin-ish: layered sines as noise proxy
function noise(x, y, tm) {
  return 0.5 * Math.sin(x * 0.3 + tm * 0.7)
       + 0.3 * Math.sin(y * 0.5 - tm * 0.4)
       + 0.2 * Math.sin((x + y) * 0.2 + tm * 1.1);
}

function tick() {
  t += 0.016;
  ctx.clearRect(0, 0, W, H);

  // Deep red background vignette
  const vg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  vg.addColorStop(0, '#110008');
  vg.addColorStop(1, '#000000');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  cells.forEach(cell => {
    const x = cell.c * CELL;
    const y = cell.r * CELL;
    const cx = x + CELL/2;
    const cy = y + CELL/2;

    // Distance to mouse
    const mdx = cx - mouse.x;
    const mdy = cy - mouse.y;
    const mdist = Math.sqrt(mdx*mdx+mdy*mdy);
    const mouseInfluence = Math.max(0, 1 - mdist / (CELL * 5));

    // Wound from hover
    if (mouseInfluence > 0.3 && !mouse.down) {
      cell.wound = Math.min(1, cell.wound + 0.04 * mouseInfluence);
    }
    if (mouse.down && mouseInfluence > 0.2) {
      cell.wound = Math.max(0, cell.wound - 0.06);
    }
    cell.wound *= 0.995; // slow natural healing

    // Mutant spread
    if (mutationLevel > 0.3 && Math.random() < 0.0002 * mutationLevel) {
      cell.mutant = true;
    }
    if (mutationLevel < 0.1 && cell.mutant) {
      cell.mutant = Math.random() > 0.001;
    }

    // Breathing scale
    const breath = 1 + 0.06 * Math.sin(t * cell.rate + cell.phase);
    // Organic warp via noise
    const n = noise(cell.c * 0.4, cell.r * 0.4, t * 0.5 + cell.seed * 10);
    const warp = n * CELL * (0.15 + mutationLevel * 0.25);

    // Offset the cell center organically
    const ox = warp * Math.cos(cell.phase2 + t * 0.3);
    const oy = warp * Math.sin(cell.phase2 + t * 0.3);

    // Size
    const sz = CELL * breath * (0.82 - cell.wound * 0.3 + mutationLevel * 0.1);

    // Color: deep biological
    // Healthy: dark rose-red, wounded: bright crimson/open flesh
    // Mutant: sickly yellow-green
    let hue, sat, lum, alpha;
    if (cell.mutant) {
      hue = 70 + 20 * Math.sin(t * 2 + cell.phase);
      sat = 60 + 30 * Math.sin(t * 1.3 + cell.phase2);
      lum = 15 + 20 * Math.abs(Math.sin(t * cell.rate + cell.phase));
      alpha = 0.7 + 0.3 * Math.abs(Math.sin(t + cell.phase));
    } else {
      hue = 345 + 15 * Math.sin(t * cell.rate * 0.5 + cell.phase) + cell.wound * (-30);
      sat = 55 + 35 * cell.wound + mouseInfluence * 20;
      lum = 8 + 12 * Math.abs(Math.sin(t * cell.rate + cell.phase)) + cell.wound * 25;
      alpha = 0.55 + 0.3 * cell.wound + 0.15 * mouseInfluence;
    }

    // Draw cell as organic blob (rounded rect with per-corner noise)
    ctx.save();
    ctx.translate(cx + ox, cy + oy);
    ctx.scale(breath, breath * (1 + 0.04 * Math.sin(t * 1.7 + cell.phase)));

    // Glow on wound/mutant
    if (cell.wound > 0.2 || cell.mutant) {
      ctx.shadowColor = cell.mutant
        ? `hsla(75,100%,50%,0.6)`
        : `hsla(0,100%,50%,${cell.wound * 0.8})`;
      ctx.shadowBlur = CELL * (cell.wound * 1.5 + (cell.mutant ? 1 : 0));
    }

    const hs = sz / 2;
    // Organic shape via bezier
    const jitter = () => (Math.random() - 0.5) * sz * 0.18;
    ctx.beginPath();
    ctx.moveTo(-hs + jitter(), -hs + jitter());
    ctx.bezierCurveTo(
      jitter(), -hs * 1.2 + jitter(),
      hs * 0.8 + jitter(), -hs * 0.8 + jitter(),
      hs + jitter(), jitter()
    );
    ctx.bezierCurveTo(
      hs * 1.2 + jitter(), hs * 0.8 + jitter(),
      jitter(), hs * 1.1 + jitter(),
      -hs + jitter(), hs + jitter()
    );
    ctx.bezierCurveTo(
      -hs * 1.1 + jitter(), jitter(),
      -hs * 0.8 + jitter(), -hs * 0.8 + jitter(),
      -hs + jitter(), -hs + jitter()
    );
    ctx.closePath();

    // Inner gradient — like looking into tissue
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, hs * 1.2);
    cg.addColorStop(0, `hsla(${hue + 20},${sat + 20}%,${lum + 15}%,${alpha})`);
    cg.addColorStop(0.6, `hsla(${hue},${sat}%,${lum}%,${alpha * 0.85})`);
    cg.addColorStop(1, `hsla(${hue - 20},${sat - 10}%,${lum - 8}%,0)`);
    ctx.fillStyle = cg;
    ctx.fill();

    // Wound crack lines
    if (cell.wound > 0.4) {
      ctx.strokeStyle = `hsla(0,100%,70%,${(cell.wound - 0.4) * 1.5})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(-hs*0.3, -hs*0.2);
      ctx.lineTo(hs*0.1, hs*0.3);
      ctx.moveTo(hs*0.2, -hs*0.4);
      ctx.lineTo(-hs*0.1, hs*0.2);
      ctx.stroke();
    }

    ctx.restore();
  });

  // Veins — sinuous lines across the grid
  for (let v = 0; v < 6; v++) {
    const vx = W * (0.1 + v * 0.15);
    const amp = H * (0.04 + 0.03 * Math.sin(t * 0.3 + v));
    const speed = t * (0.4 + v * 0.08);
    const veinAlpha = 0.04 + 0.03 * Math.abs(Math.sin(t * 0.5 + v));

    ctx.strokeStyle = `rgba(180,20,40,${veinAlpha})`;
    ctx.lineWidth = 1 + mutationLevel * 2;
    ctx.beginPath();
    for (let yy = 0; yy <= H; yy += 4) {
      const xx = vx + amp * Math.sin(yy * 0.015 + speed + v);
      yy === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  }

  // Mutation overlay pulse
  if (mutationLevel > 0.1) {
    ctx.fillStyle = `rgba(80,120,0,${mutationLevel * 0.06})`;
    ctx.fillRect(0, 0, W, H);
  }

  t += 0; // already incremented above
  requestAnimationFrame(tick);
}

window.addEventListener('mousemove', e => {
  const r = C.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
window.addEventListener('mousedown', () => mouse.down = true);
window.addEventListener('mouseup', () => mouse.down = false);
window.addEventListener('click', () => {
  // Heal everything near cursor
  cells.forEach(cell => {
    const cx = cell.c * CELL + CELL/2;
    const cy = cell.r * CELL + CELL/2;
    const d = Math.hypot(cx - mouse.x, cy - mouse.y);
    if (d < CELL * 6) cell.wound = Math.max(0, cell.wound - 0.5);
  });
});
window.addEventListener('wheel', e => {
  e.preventDefault();
  mutationLevel = Math.max(0, Math.min(1, mutationLevel + e.deltaY * 0.0005));
}, { passive: false });
window.addEventListener('resize', resize);

resize();
requestAnimationFrame(tick);
</script>
</body>
</html>
