<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Portal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#canvas{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:.55rem;letter-spacing:.4em;color:rgba(100,200,255,.25);text-transform:uppercase;pointer-events:none;white-space:nowrap}
#banner{position:absolute;top:1.2rem;right:1.4rem;text-align:right;pointer-events:none;font-family:'Courier New',monospace}
#banner .bnum{display:block;font-size:.5rem;letter-spacing:.35em;color:rgba(255,45,120,.5);text-transform:uppercase}
#banner .bname{display:block;font-size:.75rem;letter-spacing:.2em;color:rgba(255,255,255,.55);text-transform:uppercase;font-weight:700}
#banner .btech{display:block;font-size:.45rem;letter-spacing:.25em;color:rgba(255,255,255,.2);text-transform:uppercase;margin-top:.15rem}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="banner">
  <span class="bnum">09</span>
  <span class="bname">Portal</span>
  <span class="btech">recursive offscreen</span>
</div>
<div id="hint">move for parallax · scroll depth · click invert</div>
<script>
const C   = document.getElementById('canvas');
const ctx = C.getContext('2d');
let W = 0, H = 0;

const mouse = { x: 0.5, y: 0.5 };
let zoomDepth = 6;
let inverted  = false;
let t = 0;

// Two offscreen canvases for ping-pong
let offA, offB, ctxA, ctxB;

function initOff() {
  offA = new OffscreenCanvas(W, H);
  offB = new OffscreenCanvas(W, H);
  ctxA = offA.getContext('2d');
  ctxB = offB.getContext('2d');
}

function resize() {
  W = C.width  = C.offsetWidth  || window.innerWidth;
  H = C.height = C.offsetHeight || window.innerHeight;
  initOff();
}

const STARS = Array.from({length:120}, () => ({
  x: Math.random(), y: Math.random(),
  r: 0.5 + Math.random() * 1.5,
  speed: 0.0002 + Math.random() * 0.0006,
  phase: Math.random() * Math.PI * 2,
  hue: Math.floor(Math.random() * 360),
}));

function getPortals() {
  const cx = W / 2, cy = H / 2;
  const sep = Math.min(W,H) * 0.22;
  const angle = t * 0.12;
  return [
    { x: cx + sep * Math.cos(angle),            y: cy + sep * Math.sin(angle) * 0.5,            r: Math.min(W,H)*0.14 },
    { x: cx + sep * Math.cos(angle + Math.PI),  y: cy + sep * Math.sin(angle + Math.PI) * 0.5,  r: Math.min(W,H)*0.14 },
  ];
}

function drawScene(tc, tw, th, parallaxX, parallaxY, level, sourceCanvas) {
  tc.clearRect(0, 0, tw, th);

  // Background
  const bg = tc.createRadialGradient(tw/2 + parallaxX*20, th/2 + parallaxY*20, 0, tw/2, th/2, Math.max(tw,th));
  if (inverted) {
    bg.addColorStop(0,'#e8f4ff'); bg.addColorStop(0.5,'#c0e8ff'); bg.addColorStop(1,'#ffffff');
  } else {
    bg.addColorStop(0,'#020818'); bg.addColorStop(0.5,'#000510'); bg.addColorStop(1,'#000000');
  }
  tc.fillStyle = bg;
  tc.fillRect(0, 0, tw, th);

  // Stars
  STARS.forEach(s => {
    const sx = ((s.x + s.speed * t + parallaxX * 0.02 * (1 + level * 0.2)) % 1) * tw;
    const sy = ((s.y + s.speed * t * 0.4 + parallaxY * 0.015) % 1) * th;
    const pulse = 0.6 + 0.4 * Math.sin(t * 2 + s.phase);
    tc.beginPath();
    tc.arc(sx, sy, s.r * pulse, 0, Math.PI*2);
    tc.fillStyle = inverted
      ? `hsla(${s.hue},60%,20%,${0.4*pulse})`
      : `hsla(${s.hue},80%,85%,${0.6*pulse})`;
    tc.fill();
  });

  // Nebula wisps
  for (let n = 0; n < 3; n++) {
    const nx = tw * (0.2 + n * 0.3) + parallaxX * (10 + n*5);
    const ny = th * (0.3 + 0.2 * Math.sin(t * 0.2 + n)) + parallaxY * (8 + n*3);
    const nr = Math.min(tw,th) * (0.15 + 0.05 * Math.sin(t * 0.1 + n));
    const ng = tc.createRadialGradient(nx, ny, 0, nx, ny, nr);
    const h = (200 + n*50 + t*5) % 360;
    ng.addColorStop(0, inverted ? `hsla(${h},60%,10%,0.12)` : `hsla(${h},80%,60%,0.07)`);
    ng.addColorStop(1, 'transparent');
    tc.fillStyle = ng;
    tc.fillRect(0, 0, tw, th);
  }

  const portals = getPortals();

  if (sourceCanvas && level > 0) {
    portals.forEach((p, pi) => {
      // Draw the interior (source from previous level)
      tc.save();
      tc.beginPath();
      tc.arc(p.x, p.y, p.r, 0, Math.PI*2);
      tc.clip();
      const scale = 0.62 + 0.08 * Math.sin(t * 0.3 + pi);
      const shift = 8 * (pi === 0 ? 1 : -1);
      tc.translate(p.x, p.y);
      tc.scale(scale, scale);
      tc.translate(-p.x + shift * (mouse.x - 0.5) * 30, -p.y + shift * (mouse.y - 0.5) * 20);
      tc.drawImage(sourceCanvas, 0, 0, tw, th);
      tc.restore();

      // Ring glow — drawn on top with arc fill (no putImageData)
      const rHue = (pi * 180 + t * 20) % 360;
      const ringGrad = tc.createRadialGradient(p.x, p.y, p.r*0.88, p.x, p.y, p.r*1.16);
      ringGrad.addColorStop(0, `hsla(${rHue},100%,70%,0.65)`);
      ringGrad.addColorStop(0.5, `hsla(${rHue+30},100%,50%,0.2)`);
      ringGrad.addColorStop(1, 'transparent');
      tc.fillStyle = ringGrad;
      tc.beginPath();
      tc.arc(p.x, p.y, p.r * 1.16, 0, Math.PI*2);
      tc.arc(p.x, p.y, p.r * 0.88, 0, Math.PI*2, true);
      tc.fill('evenodd');

      // Inner shimmer
      tc.save();
      tc.beginPath();
      tc.arc(p.x, p.y, p.r, 0, Math.PI*2);
      tc.clip();
      const sh = tc.createRadialGradient(
        p.x + p.r*0.3*Math.cos(t+pi), p.y + p.r*0.3*Math.sin(t*0.7+pi), 0,
        p.x, p.y, p.r
      );
      sh.addColorStop(0, `hsla(${rHue},100%,90%,0.15)`);
      sh.addColorStop(1, 'transparent');
      tc.fillStyle = sh;
      tc.beginPath();
      tc.arc(p.x, p.y, p.r, 0, Math.PI*2);
      tc.fill();
      tc.restore();
    });
  } else {
    // Deepest level: glowing core
    portals.forEach((p, pi) => {
      const rHue = (pi * 180 + t * 20) % 360;
      const core = tc.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      core.addColorStop(0, `hsla(${rHue},100%,95%,0.9)`);
      core.addColorStop(0.3, `hsla(${rHue},100%,60%,0.6)`);
      core.addColorStop(1, `hsla(${rHue},100%,30%,0)`);
      tc.fillStyle = core;
      tc.beginPath();
      tc.arc(p.x, p.y, p.r, 0, Math.PI*2);
      tc.fill();
    });
  }
}

function tick() {
  t += 0.016;
  const px = mouse.x - 0.5;
  const py = mouse.y - 0.5;
  const depth = Math.round(zoomDepth);

  // Level 0: deepest — raw scene, no portals
  drawScene(ctxA, W, H, px, py, 0, null);

  // Ping-pong levels 1..depth
  // After each drawScene we swap which offscreen is "source" vs "dest"
  let srcCanvas = offA;
  let dstCanvas = offB;
  let dstCtx    = ctxB;

  for (let lvl = 1; lvl <= depth; lvl++) {
    drawScene(dstCtx, W, H, px * (1 + lvl * 0.3), py * (1 + lvl * 0.3), lvl, srcCanvas);
    // swap
    const tmpCanvas = srcCanvas; srcCanvas = dstCanvas; dstCanvas = tmpCanvas;
    const tmpCtx    = dstCtx;
    dstCtx = (dstCanvas === offA ? ctxA : ctxB);
    // keep dstCtx consistent (unused after swap but tidy)
    void tmpCtx;
  }

  // Final render to main canvas
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(srcCanvas, 0, 0);

  // Film grain — use globalAlpha + fillRect noise, NOT putImageData (which overwrites)
  const oldAlpha = ctx.globalAlpha;
  for (let i = 0; i < 800; i++) {
    const v = Math.random() * 255 | 0;
    ctx.fillStyle = `rgba(${v},${v},${v},0.04)`;
    ctx.fillRect(Math.random() * W | 0, Math.random() * H | 0, 1, 1);
  }
  ctx.globalAlpha = oldAlpha;

  // Depth indicator
  ctx.font = '9px Courier New';
  ctx.fillStyle = 'rgba(100,200,255,0.25)';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`DEPTH × ${depth}  ${inverted ? '[INV]' : ''}`, W - 16, H - 16);

  requestAnimationFrame(tick);
}

window.addEventListener('mousemove', e => {
  const r = C.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / W;
  mouse.y = (e.clientY - r.top)  / H;
});
window.addEventListener('wheel', e => {
  e.preventDefault();
  zoomDepth = Math.max(1, Math.min(10, zoomDepth - Math.sign(e.deltaY)));
}, { passive: false });
window.addEventListener('click', () => { inverted = !inverted; });
window.addEventListener('touchmove', e => {
  const r = C.getBoundingClientRect();
  mouse.x = (e.touches[0].clientX - r.left) / W;
  mouse.y = (e.touches[0].clientY - r.top)  / H;
}, { passive: true });
window.addEventListener('resize', resize);

requestAnimationFrame(() => { resize(); requestAnimationFrame(tick); });
</script>
</body>
</html>
