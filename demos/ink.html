<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INK BLEED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f5f0e8;cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(30,20,10,.3);font-size:11px;letter-spacing:.2em;text-transform:uppercase;pointer-events:none;font-family:'Courier New',monospace;white-space:nowrap}
#banner{position:absolute;top:1.2rem;right:1.4rem;text-align:right;pointer-events:none;font-family:'Courier New',monospace}
#banner .bnum{display:block;font-size:.5rem;letter-spacing:.35em;color:rgba(30,20,10,.3);text-transform:uppercase}
#banner .bname{display:block;font-size:.75rem;letter-spacing:.2em;color:rgba(30,20,10,.45);text-transform:uppercase;font-weight:700}
#banner .btech{display:block;font-size:.45rem;letter-spacing:.25em;color:rgba(30,20,10,.2);text-transform:uppercase;margin-top:.15rem}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="banner">
  <span class="bnum">10</span>
  <span class="bname">Ink Bleed</span>
  <span class="btech">fluid diffusion</span>
</div>
<div id="hint">click to bleed · move to diffuse</div>
<script>
/* ── Navier-Stokes fluid on a 2D grid ─────────────────────
   Each cell stores: velocity (vx,vy), and RGB ink density.
   We use typed arrays; "swap" = copy into a temp buffer
   rather than JS variable swap (which doesn't swap Float32Arrays).
   ──────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const SCALE  = 5;   // pixels per cell
const DIFF   = 0.00008;
const VISC   = 0.000001;
const DT     = 0.18;
const ITER   = 6;

let W, H, N, M;     // canvas px, grid cols/rows

// Grid buffers — flat Float32Arrays
let vx, vy, vx0, vy0;
let dR, dG, dB, dR0, dG0, dB0;
let tmp;            // reusable swap scratch

function initGrids() {
  N = Math.floor(W / SCALE);
  M = Math.floor(H / SCALE);
  const sz = N * M;
  vx  = new Float32Array(sz); vy  = new Float32Array(sz);
  vx0 = new Float32Array(sz); vy0 = new Float32Array(sz);
  dR  = new Float32Array(sz); dG  = new Float32Array(sz); dB  = new Float32Array(sz);
  dR0 = new Float32Array(sz); dG0 = new Float32Array(sz); dB0 = new Float32Array(sz);
  tmp = new Float32Array(sz);
}

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initGrids();
  drawLetters();
}

// ── Index helper ────────────────────────────────────────
const IX = (i, j) => {
  i = Math.max(0, Math.min(N - 1, i | 0));
  j = Math.max(0, Math.min(M - 1, j | 0));
  return i + j * N;
};

// ── Boundary conditions ──────────────────────────────────
function setBnd(b, x) {
  for (let i = 1; i < N - 1; i++) {
    x[IX(i, 0)]     = b === 2 ? -x[IX(i, 1)]     : x[IX(i, 1)];
    x[IX(i, M - 1)] = b === 2 ? -x[IX(i, M - 2)] : x[IX(i, M - 2)];
  }
  for (let j = 1; j < M - 1; j++) {
    x[IX(0, j)]     = b === 1 ? -x[IX(1, j)]     : x[IX(1, j)];
    x[IX(N - 1, j)] = b === 1 ? -x[IX(N - 2, j)] : x[IX(N - 2, j)];
  }
  x[IX(0,     0)]     = 0.5 * (x[IX(1, 0)]     + x[IX(0, 1)]);
  x[IX(0,     M-1)]   = 0.5 * (x[IX(1, M-1)]   + x[IX(0, M-2)]);
  x[IX(N-1,   0)]     = 0.5 * (x[IX(N-2, 0)]   + x[IX(N-1, 1)]);
  x[IX(N-1,   M-1)]   = 0.5 * (x[IX(N-2, M-1)] + x[IX(N-1, M-2)]);
}

// ── Gauss-Seidel linear solve ────────────────────────────
function linSolve(b, x, x0, a, c) {
  const inv = 1.0 / c;
  for (let k = 0; k < ITER; k++) {
    for (let j = 1; j < M - 1; j++) {
      for (let i = 1; i < N - 1; i++) {
        x[IX(i,j)] = (x0[IX(i,j)] + a*(x[IX(i-1,j)]+x[IX(i+1,j)]+x[IX(i,j-1)]+x[IX(i,j+1)])) * inv;
      }
    }
    setBnd(b, x);
  }
}

function diffuse(b, x, x0, diff) {
  const a = DT * diff * (N-2) * (M-2);
  linSolve(b, x, x0, a, 1 + 4*a);
}

function advect(b, d, d0, u, v) {
  const dtN = DT * (N-2), dtM = DT * (M-2);
  for (let j = 1; j < M-1; j++) {
    for (let i = 1; i < N-1; i++) {
      let px = i - dtN * u[IX(i,j)];
      let py = j - dtM * v[IX(i,j)];
      px = Math.max(0.5, Math.min(N-1.5, px));
      py = Math.max(0.5, Math.min(M-1.5, py));
      const i0 = px|0, i1 = i0+1;
      const j0 = py|0, j1 = j0+1;
      const s1 = px-i0, s0 = 1-s1;
      const t1 = py-j0, t0 = 1-t1;
      d[IX(i,j)] = s0*(t0*d0[IX(i0,j0)] + t1*d0[IX(i0,j1)]) +
                   s1*(t0*d0[IX(i1,j0)] + t1*d0[IX(i1,j1)]);
    }
  }
  setBnd(b, d);
}

function project(u, v, p, div) {
  const hx = 1/N, hy = 1/M;
  for (let j=1; j<M-1; j++) {
    for (let i=1; i<N-1; i++) {
      div[IX(i,j)] = -0.5*(hx*(u[IX(i+1,j)]-u[IX(i-1,j)]) + hy*(v[IX(i,j+1)]-v[IX(i,j-1)]));
      p[IX(i,j)] = 0;
    }
  }
  setBnd(0,div); setBnd(0,p);
  linSolve(0, p, div, 1, 4);
  for (let j=1; j<M-1; j++) {
    for (let i=1; i<N-1; i++) {
      u[IX(i,j)] -= 0.5*(p[IX(i+1,j)]-p[IX(i-1,j)])/hx;
      v[IX(i,j)] -= 0.5*(p[IX(i,j+1)]-p[IX(i,j-1)])/hy;
    }
  }
  setBnd(1,u); setBnd(2,v);
}

// ── Swap helper: copy a→tmp, b→a, tmp→b ─────────────────
function swap(a, b) {
  tmp.set(a); a.set(b); b.set(tmp);
}

function velStep() {
  // Add forces already in vx0/vy0, then clear them
  for (let i=0;i<vx.length;i++){ vx[i]+=DT*vx0[i]; vy[i]+=DT*vy0[i]; }
  vx0.fill(0); vy0.fill(0);

  swap(vx0, vx); diffuse(1, vx, vx0, VISC);
  swap(vy0, vy); diffuse(2, vy, vy0, VISC);
  project(vx, vy, vx0, vy0);

  swap(vx0, vx); swap(vy0, vy);
  advect(1, vx, vx0, vx0, vy0);
  advect(2, vy, vy0, vx0, vy0);
  project(vx, vy, vx0, vy0);
}

function densStep(d, d0, u, v) {
  for (let i=0;i<d.length;i++) d[i] += DT * d0[i];
  d0.fill(0);
  swap(d0, d); diffuse(0, d, d0, DIFF);
  swap(d0, d); advect(0, d, d0, u, v);
}

// ── Gravity drip ─────────────────────────────────────────
function applyGravity() {
  for (let j=1; j<M-1; j++) {
    for (let i=1; i<N-1; i++) {
      const idx = IX(i,j);
      const ink = dR[idx] + dG[idx] + dB[idx];
      if (ink > 2) vy0[idx] += 0.00005 * ink;
    }
  }
}

// ── Evaporation ──────────────────────────────────────────
function evaporate() {
  const ev = 0.9994;
  for (let i=0;i<dR.length;i++){
    dR[i]*=ev; dG[i]*=ev; dB[i]*=ev;
    if(dR[i]<0.01)dR[i]=0;
    if(dG[i]<0.01)dG[i]=0;
    if(dB[i]<0.01)dB[i]=0;
  }
}

// ── Ink splashes ─────────────────────────────────────────
const PALETTE = [
  [12, 6, 35],    // indigo
  [4, 28, 52],    // ocean
  [45, 8, 18],    // blood
  [8, 38, 22],    // forest
  [55, 12, 4],    // rust
  [5, 5, 50],     // deep navy
];
let currentPalette = 0;

function splashAt(gx, gy, radius, strength) {
  currentPalette = (currentPalette + 1) % PALETTE.length;
  const [cr, cg, cb] = PALETTE[currentPalette];
  const r = Math.ceil(radius);
  for (let dy=-r; dy<=r; dy++) {
    for (let dx=-r; dx<=r; dx++) {
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d > radius) continue;
      const f = (1 - d/radius) * strength;
      const idx = IX(gx+dx, gy+dy);
      dR0[idx] += cr * f;
      dG0[idx] += cg * f;
      dB0[idx] += cb * f;
    }
  }
}

function addForce(gx, gy, fx, fy, radius) {
  const r = Math.ceil(radius);
  for (let dy=-r; dy<=r; dy++) {
    for (let dx=-r; dx<=r; dx++) {
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d>radius) continue;
      const f = (1 - d/radius) * 0.5;
      const idx = IX(gx+dx, gy+dy);
      vx0[idx] += fx * f;
      vy0[idx] += fy * f;
    }
  }
}

// ── Letter seeds ─────────────────────────────────────────
let letterSeeds = [];
const WORDS2 = ['DISSOLVE','INK','BLEED','FADE','DRIFT'];
let wordI = 0;

function drawLetters() {
  const tmp2 = document.createElement('canvas');
  tmp2.width = W; tmp2.height = H;
  const tc = tmp2.getContext('2d');
  const fs = Math.min(W * 0.22, H * 0.38);
  tc.font = `900 ${fs}px Georgia, serif`;
  tc.textAlign = 'center';
  tc.textBaseline = 'middle';
  tc.fillStyle = '#1a1008';
  tc.fillText(WORDS2[wordI], W/2, H/2);
  const data = tc.getImageData(0, 0, W, H).data;
  letterSeeds = [];
  const step = 8;
  for (let y=0; y<H; y+=step) {
    for (let x=0; x<W; x+=step) {
      if (data[(y*W+x)*4+3] > 100) {
        letterSeeds.push({ x: (x/SCALE)|0, y: (y/SCALE)|0 });
      }
    }
  }
}

function stampWord() {
  const [cr,cg,cb] = PALETTE[(Math.random()*PALETTE.length)|0];
  const sample = letterSeeds.length > 600
    ? letterSeeds.filter((_,i) => i%2===0) : letterSeeds;
  for (const s of sample) {
    const idx = IX(s.x, s.y);
    dR0[idx] += cr * 1.2;
    dG0[idx] += cg * 1.2;
    dB0[idx] += cb * 1.2;
    vx0[idx] += (Math.random()-0.5)*0.003;
    vy0[idx] += (Math.random()-0.5)*0.003;
  }
}

// ── Render ───────────────────────────────────────────────
let imgData;
function render() {
  if (!imgData || imgData.width !== W || imgData.height !== H) {
    imgData = ctx.createImageData(W, H);
  }
  const px = imgData.data;
  const bgR=245, bgG=240, bgB=232;

  for (let j=0; j<M; j++) {
    for (let i=0; i<N; i++) {
      const gi = IX(i,j);
      const r = dR[gi], g = dG[gi], b = dB[gi];
      const total = r + g + b;
      const alpha = Math.min(1, total * 0.006);

      const rn = total > 0 ? r/total : 0;
      const gn = total > 0 ? g/total : 0;
      const bn = total > 0 ? b/total : 0;

      // Very dark ink tone — nearly black with subtle hue
      const inkR = rn * 18;
      const inkG = gn * 18;
      const inkB = bn * 22;

      const wet = Math.min(1, alpha * 1.6);

      const fr = (bgR*(1-wet) + inkR*wet) | 0;
      const fg = (bgG*(1-wet) + inkG*wet) | 0;
      const fb = (bgB*(1-wet) + inkB*wet) | 0;

      const x0 = i*SCALE, y0 = j*SCALE;
      for (let py=0; py<SCALE; py++) {
        for (let px2=0; px2<SCALE; px2++) {
          const sx=x0+px2, sy=y0+py;
          if (sx>=W||sy>=H) continue;
          const pi=(sy*W+sx)*4;
          px[pi]=fr; px[pi+1]=fg; px[pi+2]=fb; px[pi+3]=255;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── Mouse ─────────────────────────────────────────────────
let mx=0, my=0, pmx=0, pmy=0;

canvas.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
canvas.addEventListener('click', e => {
  const gx=(e.clientX/SCALE)|0, gy=(e.clientY/SCALE)|0;
  splashAt(gx, gy, 7, 14);
  for (let a=0; a<Math.PI*2; a+=0.35) {
    addForce(gx+Math.cos(a)*3|0, gy+Math.sin(a)*3|0, Math.cos(a)*0.9, Math.sin(a)*0.9, 2);
  }
});
window.addEventListener('wheel', e => {
  const gx=(mx/SCALE)|0, gy=(my/SCALE)|0;
  addForce(gx, gy, 0, e.deltaY*0.0005, 9);
  splashAt(gx, gy, 3, Math.abs(e.deltaY)*0.025);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mx=e.touches[0].clientX; my=e.touches[0].clientY;
}, {passive:false});
canvas.addEventListener('touchstart', e => {
  const t=e.touches[0];
  splashAt((t.clientX/SCALE)|0,(t.clientY/SCALE)|0,7,14);
});
window.addEventListener('resize', resize);

// ── Loop ─────────────────────────────────────────────────
let frame=0;
function loop() {
  requestAnimationFrame(loop);
  frame++;

  const gx=(mx/SCALE)|0, gy=(my/SCALE)|0;
  const fxf=(mx-pmx)/SCALE*0.35, fyf=(my-pmy)/SCALE*0.35;
  const spd=Math.sqrt(fxf*fxf+fyf*fyf);
  if (spd>0.08) {
    addForce(gx, gy, fxf, fyf, 5);
    if (spd>0.6) splashAt(gx, gy, 2, spd*0.4);
  }
  pmx=mx; pmy=my;

  applyGravity();
  velStep();
  densStep(dR, dR0, vx, vy);
  densStep(dG, dG0, vx, vy);
  densStep(dB, dB0, vx, vy);
  evaporate();

  if (frame % 900 === 0) {
    wordI = (wordI+1) % WORDS2.length;
    drawLetters(); stampWord();
  }

  render();
}

// ── Init ─────────────────────────────────────────────────
requestAnimationFrame(() => {
  resize();
  setTimeout(() => { stampWord(); loop(); }, 80);
});
</script>
</body>
</html>
