<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dead Signal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#canvas{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:.55rem;letter-spacing:.4em;color:rgba(255,255,255,.15);text-transform:uppercase;pointer-events:none;white-space:nowrap}
#banner{position:absolute;top:1.2rem;right:1.4rem;text-align:right;pointer-events:none;font-family:'Courier New',monospace}
#banner .bnum{display:block;font-size:.5rem;letter-spacing:.35em;color:rgba(255,45,120,.5);text-transform:uppercase}
#banner .bname{display:block;font-size:.75rem;letter-spacing:.2em;color:rgba(255,255,255,.55);text-transform:uppercase;font-weight:700}
#banner .btech{display:block;font-size:.45rem;letter-spacing:.25em;color:rgba(255,255,255,.2);text-transform:uppercase;margin-top:.15rem}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="banner">
  <span class="bnum">08</span>
  <span class="bname">Dead Signal</span>
  <span class="btech">CRT phosphor + waveform</span>
</div>
<div id="hint">move to tune · scroll to change frequency · click to spike</div>
<script>
/* ═══════════════════════════════════════════════════════
   DEAD SIGNAL
   A CRT oscilloscope that reads noise from the void.
   Mouse X = frequency  Mouse Y = amplitude / chaos
   Scroll  = waveform type morphing
   Click   = voltage spike / discharge
   ═══════════════════════════════════════════════════════ */

const C   = document.getElementById('canvas');
const ctx = C.getContext('2d');
let W, H;

function resize() { W = C.width = C.offsetWidth; H = C.height = C.offsetHeight; }

const mouse = { x: 0.5, y: 0.5 }; // normalized
let waveType = 0;    // 0..4 morphed by scroll
let spikes = [];     // voltage spikes
let t = 0;
let scanLine = 0;

// ── WAVEFORM GENERATORS ─────────────────────────────────
function sine(x, freq, phase)  { return Math.sin(x * freq + phase); }
function square(x, freq, phase){ return Math.sign(Math.sin(x * freq + phase)); }
function sawtooth(x, freq, phase) {
  const p = (x * freq / (2*Math.PI) + phase/(2*Math.PI)) % 1;
  return 2 * (p - Math.floor(p + 0.5));
}
function pulse(x, freq, phase, duty=0.3) {
  const p = ((x * freq + phase) / (2*Math.PI)) % 1;
  return p < duty ? 1 : -1;
}
function noise2(x, t) {
  // Deterministic noise via layered sines
  return 0.4*Math.sin(x*7.3+t*2.1)
       + 0.3*Math.sin(x*13.7-t*3.3)
       + 0.2*Math.sin(x*29.1+t*1.7)
       + 0.1*Math.sin(x*53.3-t*4.9);
}

function sample(x, type, freq, phase) {
  const t0 = t;
  switch (Math.floor(type) % 5) {
    case 0: return sine(x, freq, phase);
    case 1: return sawtooth(x, freq, phase);
    case 2: return square(x, freq, phase);
    case 3: return pulse(x, freq, phase, 0.2 + 0.3 * mouse.y);
    case 4: return noise2(x, t0);
  }
  return 0;
}

// Morph between two waveforms
function sampleMorph(x, typeF, freq, phase) {
  const lo = Math.floor(typeF) % 5;
  const hi = (lo + 1) % 5;
  const blend = typeF - Math.floor(typeF);
  return sample(x, lo, freq, phase) * (1-blend) + sample(x, hi, freq, phase) * blend;
}

// CRT phosphor decay buffer (RGBA flat array)
let phosphor;
function initPhosphor() {
  phosphor = new Uint8ClampedArray(W * H * 4);
}

function tick() {
  t += 0.016;
  const freq = 2 + mouse.x * 18;     // 2..20 Hz equivalent
  const amp  = 0.15 + mouse.y * 0.35; // 15%..50% of half-height
  const chaos = mouse.y;

  // ── PHOSPHOR DECAY ──────────────────────────────────────
  // Fade phosphor buffer
  for (let i = 0; i < phosphor.length; i += 4) {
    phosphor[i]   = Math.max(0, phosphor[i]   - 18);
    phosphor[i+1] = Math.max(0, phosphor[i+1] - 12);
    phosphor[i+2] = Math.max(0, phosphor[i+2] - 6);
    // alpha stays 255
    phosphor[i+3] = 255;
  }

  const cy = H / 2;

  // ── DRAW WAVEFORM INTO PHOSPHOR ──────────────────────────
  const STEPS = W * 2;
  let prevPY = -1;
  for (let s = 0; s <= STEPS; s++) {
    const nx = s / STEPS; // 0..1
    const px = Math.floor(nx * W);

    // Primary wave
    let val = sampleMorph(nx * Math.PI * 2, waveType, freq, t * 2);

    // Add chaos harmonics
    if (chaos > 0.3) {
      val += chaos * 0.4 * Math.sin(nx * Math.PI * 2 * freq * 3.7 + t * 5.1);
      val += chaos * 0.2 * noise2(nx * 20, t * 2);
    }

    // Spikes
    spikes.forEach(sp => {
      const dd = Math.abs(nx - sp.x);
      if (dd < 0.05) {
        val += sp.amp * Math.exp(-dd * 200) * sp.life;
      }
    });

    const py = Math.round(cy - val * amp * cy);
    const py2 = Math.max(0, Math.min(H-1, py));

    // Draw line from prevPY to py2
    const y0 = prevPY < 0 ? py2 : Math.min(prevPY, py2);
    const y1 = prevPY < 0 ? py2 : Math.max(prevPY, py2);
    for (let yyy = y0; yyy <= y1; yyy++) {
      const idx = (yyy * W + px) * 4;
      if (idx >= 0 && idx < phosphor.length - 4) {
        phosphor[idx]   = Math.min(255, phosphor[idx]   + 160); // R
        phosphor[idx+1] = Math.min(255, phosphor[idx+1] + 255); // G (green phosphor)
        phosphor[idx+2] = Math.min(255, phosphor[idx+2] + 80);  // B
      }
    }
    prevPY = py2;
  }

  // ── RENDER PHOSPHOR TO CANVAS ──────────────────────────
  const img = ctx.createImageData(W, H);
  img.data.set(phosphor);
  ctx.putImageData(img, 0, 0);

  // ── CRT OVERLAY EFFECTS ─────────────────────────────────

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = 0; y < H; y += 2) {
    ctx.fillRect(0, y, W, 1);
  }

  // Moving scan beam
  scanLine = (scanLine + 1.5) % H;
  const sg = ctx.createLinearGradient(0, scanLine - 40, 0, scanLine + 40);
  sg.addColorStop(0, 'rgba(150,255,150,0)');
  sg.addColorStop(0.5, 'rgba(150,255,150,0.04)');
  sg.addColorStop(1, 'rgba(150,255,150,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, scanLine - 40, W, 80);

  // Vignette
  const vig = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.7)');
  ctx.fillStyle = vig;
  ctx.fillRect(0,0,W,H);

  // Screen flicker
  if (Math.random() < 0.004) {
    ctx.fillStyle = `rgba(0,255,80,${Math.random() * 0.07})`;
    ctx.fillRect(0,0,W,H);
  }

  // Horizontal jitter line (interference)
  if (Math.random() < 0.02) {
    const jy = Math.random() * H;
    const jw = 30 + Math.random() * 200;
    const jx = Math.random() * (W - jw);
    ctx.fillStyle = `rgba(0,255,80,${0.1 + Math.random() * 0.2})`;
    ctx.fillRect(jx, jy, jw, 1 + Math.random() * 2);
  }

  // Wave type label
  const typeNames = ['SINE','SAWTOOTH','SQUARE','PULSE','CHAOS'];
  const t0 = Math.floor(waveType) % 5;
  const t1 = (t0+1)%5;
  const blend = waveType - Math.floor(waveType);
  ctx.font = '10px Courier New';
  ctx.fillStyle = `rgba(0,255,80,0.35)`;
  ctx.textAlign = 'left';
  ctx.fillText(`${typeNames[t0]} ${blend>0.05?'→ '+typeNames[t1]:''}  ${freq.toFixed(1)}Hz`, 16, H - 16);

  // Update spikes
  spikes = spikes.filter(s => { s.life -= 0.03; return s.life > 0; });

  requestAnimationFrame(tick);
}

// ── EVENTS ────────────────────────────────────────────────
window.addEventListener('mousemove', e => {
  const r = C.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / W;
  mouse.y = (e.clientY - r.top)  / H;
});

window.addEventListener('wheel', e => {
  e.preventDefault();
  waveType = (waveType + e.deltaY * 0.003 + 5) % 5;
}, { passive: false });

window.addEventListener('click', e => {
  const r = C.getBoundingClientRect();
  spikes.push({
    x: (e.clientX - r.left) / W,
    amp: 2 + Math.random() * 3,
    life: 1.0,
  });
  // Flash
  ctx.fillStyle = 'rgba(0,255,80,0.15)';
  ctx.fillRect(0,0,W,H);
});

window.addEventListener('touchmove', e => {
  const r = C.getBoundingClientRect();
  mouse.x = (e.touches[0].clientX - r.left) / W;
  mouse.y = (e.touches[0].clientY - r.top)  / H;
}, {passive:true});

window.addEventListener('resize', () => { resize(); initPhosphor(); });

resize();
initPhosphor();
requestAnimationFrame(tick);
</script>
</body>
</html>
