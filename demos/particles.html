<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matter → Ghost</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    height: 500vh;
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
  }

  .stage {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .scroll-hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.5s;
    z-index: 10;
  }

  .scroll-hint.hidden { opacity: 0; }

  .progress-label {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 10;
    text-align: center;
  }

  .technique-badge {
    position: fixed;
    top: 70px;
    right: 24px;
    background: rgba(0,0,0,0.8);
    border: 1px solid rgba(255,45,120,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: rgba(255,45,120,0.8);
    pointer-events: none;
    line-height: 1.8;
    backdrop-filter: blur(10px);
    max-width: 200px;
    z-index: 20;
  }

  .technique-badge strong {
    color: #ff2d78;
    display: block;
    margin-bottom: 4px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>

<div class="stage">
  <canvas id="particleCanvas"></canvas>
</div>

<div class="scroll-hint" id="scrollHint">scroll down · watch matter dissolve</div>

<div class="progress-label" id="progressLabel">0% dissolved</div>

<div class="technique-badge">
  <strong>How it works</strong>
  Canvas 2D API<br>
  Text → pixel sample<br>
  Particle physics<br>
  Scroll → force field<br>
  requestAnimationFrame
</div>

<script>
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('scrollHint');
const progressLabel = document.getElementById('progressLabel');

let W, H, particles = [], initialized = false;
let scrollProgress = 0;
let mouse = { x: -9999, y: -9999 };

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (initialized) init();
}
resize();
window.addEventListener('resize', resize);

// ---- PARTICLE CLASS ----
class Particle {
  constructor(x, y, color) {
    this.originX = x;
    this.originY = y;
    this.x = x;
    this.y = y;
    this.color = color;
    this.size = Math.random() * 2.5 + 0.5;
    this.vx = 0;
    this.vy = 0;
    this.alpha = 1;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.5 + 0.2;
    // Explosion target
    this.tx = (Math.random() - 0.5) * W * 1.5;
    this.ty = (Math.random() - 0.5) * H * 1.5;
  }

  update(progress) {
    // 0 = solid text, 1 = full ghost/explosion

    // Phase 1 (0-0.4): particles start drifting
    // Phase 2 (0.4-0.7): particles explode outward
    // Phase 3 (0.7-1): pure chaos / ghost

    let targetX, targetY, targetAlpha;

    if (progress < 0.35) {
      // Orbiting in place, subtle
      const drift = progress / 0.35;
      targetX = this.originX + Math.sin(this.angle + drift * 2) * 3 * drift;
      targetY = this.originY + Math.cos(this.angle) * 2 * drift;
      targetAlpha = 1;
    } else if (progress < 0.65) {
      // Explosion
      const p = (progress - 0.35) / 0.3;
      const ease = p * p;
      targetX = this.originX + (this.tx - this.originX) * ease * 0.6;
      targetY = this.originY + (this.ty - this.originY) * ease * 0.6;
      targetAlpha = 1 - ease * 0.5;
    } else {
      // Ghost — fully dispersed
      const p = (progress - 0.65) / 0.35;
      targetX = this.originX + this.tx * 0.6 + Math.sin(this.angle + p * 5) * 40;
      targetY = this.originY + this.ty * 0.6 + Math.cos(this.angle * 1.3 + p * 3) * 40;
      targetAlpha = Math.max(0.02, 0.5 - p * 0.45);
    }

    // Mouse repulsion
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 80) {
      const force = (80 - dist) / 80;
      this.vx += (dx / dist) * force * 3;
      this.vy += (dy / dist) * force * 3;
    }

    // Lerp toward target + dampen velocity
    this.vx += (targetX - this.x) * 0.08;
    this.vy += (targetY - this.y) * 0.08;
    this.vx *= 0.85;
    this.vy *= 0.85;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha += (targetAlpha - this.alpha) * 0.08;
    this.angle += this.speed * 0.05;
  }

  draw() {
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- SAMPLE TEXT → PARTICLES ----
function init() {
  particles = [];

  // Draw text to an offscreen canvas to sample pixel positions
  const offscreen = document.createElement('canvas');
  offscreen.width = W;
  offscreen.height = H;
  const off = offscreen.getContext('2d');

  const fontSize = Math.min(W * 0.16, H * 0.22, 180);
  off.font = `700 ${fontSize}px 'Space Grotesk', sans-serif`;
  off.fillStyle = '#fff';
  off.textAlign = 'center';
  off.textBaseline = 'middle';

  // Draw two lines
  const line1 = 'MATTER';
  const line2 = 'GHOST';
  off.fillText(line1, W / 2, H / 2 - fontSize * 0.55);
  off.fillText(line2, W / 2, H / 2 + fontSize * 0.55);

  const imageData = off.getImageData(0, 0, W, H);
  const data = imageData.data;

  const STEP = Math.max(2, Math.floor(W / 280)); // sample density

  for (let y = 0; y < H; y += STEP) {
    for (let x = 0; x < W; x += STEP) {
      const idx = (y * W + x) * 4;
      const alpha = data[idx + 3];
      if (alpha > 128) {
        // Color: mix between pink and cyan based on y position
        const t = (y - (H/2 - fontSize)) / (fontSize * 2);
        const hue = t < 0.5 ? 340 : 190;
        const sat = 90 + Math.random() * 10;
        const lit = 55 + Math.random() * 20;
        const color = `hsl(${hue}, ${sat}%, ${lit}%)`;
        particles.push(new Particle(x, y, color));
      }
    }
  }
  initialized = true;
}

// Wait for fonts to load before init
document.fonts.ready.then(init);

// ---- RENDER LOOP ----
let lastProgress = -1;

function animate() {
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  particles.forEach(p => {
    p.update(scrollProgress);
    p.draw();
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
animate();

// ---- SCROLL ----
const SCROLL_RANGE = window.innerHeight * 3;

window.addEventListener('scroll', () => {
  scrollProgress = Math.min(window.scrollY / SCROLL_RANGE, 1);
  hint.classList.toggle('hidden', scrollProgress > 0.03);

  const labels = ['0% dissolved', '...awakening...', 'dissolving...', 'dispersing...', 'ghost mode', 'pure energy'];
  const idx = Math.floor(scrollProgress * (labels.length - 1));
  progressLabel.textContent = labels[idx] || labels[labels.length - 1];
}, { passive: true });

// ---- MOUSE ----
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: true });
</script>
</body>
</html>
