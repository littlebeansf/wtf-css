<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Decay</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* SCANLINES overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.35) 2px,
      rgba(0,0,0,0.35) 4px
    );
    pointer-events: none;
    z-index: 1000;
    mix-blend-mode: multiply;
  }

  /* VIGNETTE */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* THE TEXT — multiple clipped copies create glitch slices */
  .glitch-wrap {
    position: relative;
    display: inline-block;
  }

  .glitch-text {
    font-size: clamp(4rem, 13vw, 14rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    color: #fff;
    text-transform: uppercase;
    line-height: 1;
    user-select: none;
    pointer-events: none;
    position: relative;
    z-index: 2;
  }

  /* GLITCH SLICES — pseudo elements with clip-path */
  .glitch-text::before {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: #ff2d78;
    animation: glitch-slice-1 3.5s infinite;
    z-index: 3;
  }

  .glitch-text::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: #00e5ff;
    animation: glitch-slice-2 3.5s infinite;
    z-index: 3;
  }

  @keyframes glitch-slice-1 {
    0%   { clip-path: inset(40% 0 55% 0); transform: translate(-4px, 0); }
    5%   { clip-path: inset(10% 0 80% 0); transform: translate(4px, 0); }
    10%  { clip-path: inset(70% 0 15% 0); transform: translate(-3px, 2px); }
    15%  { clip-path: inset(0% 0 0% 0); transform: translate(0, 0); opacity: 0; }
    20%  { clip-path: inset(85% 0 5% 0); transform: translate(5px, 0); opacity: 1; }
    25%  { clip-path: inset(30% 0 60% 0); transform: translate(-5px, 0); }
    30%  { transform: translate(0, 0); clip-path: inset(100% 0 0 0); }
    80%  { clip-path: inset(60% 0 35% 0); transform: translate(3px, 0); }
    85%  { clip-path: inset(20% 0 70% 0); transform: translate(-3px, 0); }
    90%  { clip-path: inset(0% 0 0% 0); transform: translate(0, 0); opacity: 0; }
    95%  { clip-path: inset(45% 0 50% 0); transform: translate(4px, 0); opacity: 1; }
    100% { clip-path: inset(100% 0 0 0); transform: translate(0, 0); }
  }

  @keyframes glitch-slice-2 {
    0%   { clip-path: inset(60% 0 30% 0); transform: translate(4px, 0); }
    5%   { clip-path: inset(85% 0 5% 0); transform: translate(-4px, 0); }
    10%  { clip-path: inset(20% 0 65% 0); transform: translate(3px, -2px); }
    15%  { clip-path: inset(0% 0 0% 0); transform: translate(0, 0); opacity: 0; }
    20%  { clip-path: inset(50% 0 45% 0); transform: translate(-5px, 0); opacity: 1; }
    25%  { clip-path: inset(75% 0 15% 0); transform: translate(5px, 0); }
    30%  { transform: translate(0, 0); clip-path: inset(100% 0 0 0); }
    75%  { clip-path: inset(40% 0 55% 0); transform: translate(-3px, 0); }
    80%  { clip-path: inset(15% 0 78% 0); transform: translate(3px, 0); }
    85%  { clip-path: inset(0% 0 0% 0); transform: translate(0, 0); opacity: 0; }
    90%  { clip-path: inset(70% 0 25% 0); transform: translate(-4px, 0); opacity: 1; }
    95%  { clip-path: inset(100% 0 0 0); transform: translate(0, 0); }
    100% { clip-path: inset(100% 0 0 0); }
  }

  /* RANDOM HORIZONTAL BARS */
  .glitch-bars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
  }

  .bar {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(255,45,120,0.5);
    animation: bar-glitch linear infinite;
    mix-blend-mode: screen;
  }

  .bar:nth-child(even) { background: rgba(0,229,255,0.5); }

  @keyframes bar-glitch {
    0%, 100% { opacity: 0; transform: translateX(0); }
    50% { opacity: 1; transform: translateX(var(--tx)); }
  }

  /* VHS NOISE CANVAS */
  #noiseCanvas {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    pointer-events: none;
    z-index: 1;
  }

  /* STATIC BURSTS */
  .static-burst {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 998;
    animation: static-flash 6s infinite;
  }

  @keyframes static-flash {
    0%, 98%, 100% { opacity: 0; }
    98.5% { opacity: 0.03; }
    99% { opacity: 0.06; }
    99.5% { opacity: 0.02; }
  }

  /* CHANNEL TEXT */
  .channel-text {
    position: fixed;
    top: 20px;
    left: 30px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.2em;
    animation: channel-flicker 4s infinite;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes channel-flicker {
    0%, 90%, 100% { opacity: 0.3; }
    91% { opacity: 0.8; }
    92% { opacity: 0.2; }
    93% { opacity: 0.9; }
    94% { opacity: 0.1; }
    95% { opacity: 0.4; }
  }

  /* INSTRUCTION */
  .instruction {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    text-align: center;
  }

  .technique-badge {
    position: fixed;
    top: 70px;
    right: 24px;
    background: rgba(0,0,0,0.8);
    border: 1px solid rgba(255,45,120,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: rgba(255,45,120,0.8);
    pointer-events: none;
    line-height: 1.8;
    backdrop-filter: blur(10px);
    max-width: 200px;
    z-index: 1001;
  }

  .technique-badge strong {
    color: #ff2d78;
    display: block;
    margin-bottom: 4px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="noiseCanvas"></canvas>
<div class="static-burst"></div>

<div class="channel-text">CH. 04 ▐ SIGNAL DECAY</div>

<div class="scene">
  <div class="glitch-bars" id="glitchBars"></div>

  <div class="glitch-wrap">
    <div class="glitch-text" data-text="SIGNAL" id="glitchText">SIGNAL</div>
  </div>
</div>

<div class="instruction">click to trigger glitch storm</div>

<div class="technique-badge">
  <strong>How it works</strong>
  clip-path: inset()<br>
  CSS @keyframes<br>
  pseudo-elements<br>
  Canvas VHS noise<br>
  CSS scanlines
</div>

<script>
// RANDOM BARS
const barsContainer = document.getElementById('glitchBars');
function addBar() {
  const bar = document.createElement('div');
  bar.className = 'bar';
  const top = Math.random() * 100;
  bar.style.top = top + '%';
  bar.style.setProperty('--tx', (Math.random() * 40 - 20) + 'px');
  const dur = (Math.random() * 0.3 + 0.1).toFixed(2);
  bar.style.animationDuration = dur + 's';
  bar.style.animationDelay = -Math.random() * dur + 's';
  bar.style.height = (Math.random() * 8 + 1) + 'px';
  bar.style.opacity = Math.random() * 0.6;
  barsContainer.appendChild(bar);
  setTimeout(() => bar.remove(), 4000);
}

setInterval(addBar, 150);
for (let i = 0; i < 8; i++) addBar();

// VHS NOISE
const canvas = document.getElementById('noiseCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function drawNoise() {
  const id = ctx.createImageData(canvas.width, canvas.height);
  const data = id.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 255;
    data[i] = data[i+1] = data[i+2] = v;
    data[i+3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  requestAnimationFrame(drawNoise);
}
drawNoise();

// CLICK — STORM MODE
let stormTimeout;
document.addEventListener('click', () => {
  const gt = document.getElementById('glitchText');
  gt.style.animation = 'none';
  gt.style.transform = 'skewX(-3deg) scaleX(0.97)';

  // Add storm bars
  for (let i = 0; i < 30; i++) {
    setTimeout(addBar, i * 30);
  }

  // Cycle through words
  const words = ['SIGNAL', 'DECAY', 'ERROR', '404', 'WTFCSS', 'GLITCH', 'SIGNAL'];
  let wi = 0;
  const interval = setInterval(() => {
    gt.textContent = words[wi % words.length];
    gt.setAttribute('data-text', words[wi % words.length]);
    wi++;
    if (wi >= words.length) {
      clearInterval(interval);
      gt.style.transform = '';
    }
  }, 80);

  clearTimeout(stormTimeout);
  stormTimeout = setTimeout(() => {
    gt.textContent = 'SIGNAL';
    gt.setAttribute('data-text', 'SIGNAL');
    gt.style.animation = '';
    gt.style.transform = '';
  }, 800);
});
</script>
</body>
</html>
